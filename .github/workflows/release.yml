# ============================================================
# PicoGallery — Build & Release for Raspberry Pi
# ============================================================
# Triggers:
#   - Push a tag like v0.1.0  → full release with GitHub Release
#   - Push to main            → build-only (artifact upload, no release)
#   - Manual dispatch         → build any branch; optionally create a release
#
# Cross-compilation uses `cross` with per-target Docker images (see Cross.toml).
#
# Targets:
#   - aarch64-unknown-linux-gnu     (Pi Zero 2 W, Pi 3/4/5 64-bit)
#   - armv7-unknown-linux-gnueabihf (Pi 2, Pi 3/4 32-bit OS)
# ============================================================

name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        type: string
        default: "main"
      tag:
        description: "Release tag (e.g. v0.1.3-kva.1). Required when create_release is true."
        type: string
        default: ""
      create_release:
        description: "Create a GitHub release"
        type: boolean
        default: false
      prerelease:
        description: "Mark release as pre-release (recommended for feature branches)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            strip: aarch64-linux-gnu-strip
            pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig

          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
            strip: arm-linux-gnueabihf-strip
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Resolve version label
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            echo "label=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            BRANCH="${GITHUB_REF_NAME}"
            echo "label=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: |
          cargo install cross --version 0.2.5 --locked

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cross-

      - name: Build release binary
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: |
          # Build with the same default feature set as a full local build
          # (includes plugin-photoprism so Pi installs can use download mode).
          cross build \
            --release \
            --target ${{ matrix.target }} \
            --features default

      - name: Prepare artifact
        run: |
          BINARY="target/${{ matrix.target }}/release/picogallery"
          VERSION="${{ steps.ver.outputs.label }}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf
          if command -v "${{ matrix.strip }}" &>/dev/null; then
            "${{ matrix.strip }}" "$BINARY" 2>/dev/null || true
          fi

          ARTIFACT_NAME="picogallery-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${ARTIFACT_NAME}"

          cp "$BINARY"              "dist/${ARTIFACT_NAME}/picogallery"
          cp -r sample_photos       "dist/${ARTIFACT_NAME}/" 2>/dev/null || true
          cp picogallery.service    "dist/${ARTIFACT_NAME}/"
          cp config.example.toml    "dist/${ARTIFACT_NAME}/"
          cp install.sh             "dist/${ARTIFACT_NAME}/" 2>/dev/null || true
          cp deploy.sh              "dist/${ARTIFACT_NAME}/" 2>/dev/null || true
          cp LICENSE                "dist/${ARTIFACT_NAME}/" 2>/dev/null || true
          cp README.md              "dist/${ARTIFACT_NAME}/" 2>/dev/null || true

          cd dist
          tar czf "${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=dist/${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"

          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version label:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Binary size:** $(du -h ../${BINARY} | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive:** ${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.create_release == 'true' &&
       github.event.inputs.tag != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.tar.gz" -exec cp {} release-files/ \;
          find artifacts -name "*.sha256" -exec cp {} release-files/ \;

          echo "### Release Files" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release-files/ >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: >-
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease ||
                contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Installation (no on-device compile)

            Download the pre-built binary for your Pi architecture, or install with:

            ```bash
            PICOGALLERY_VERSION=${{ steps.tag.outputs.name }} \
              curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/kva-revamparchitecture/install.sh | sudo bash -s -- \
              --mode download -y --version ${{ steps.tag.outputs.name }} \
              --photoprism-url http://YOUR_PHOTOPRISM:2342 \
              --photoprism-user admin \
              --photoprism-pass YOUR_PASSWORD
            ```

            Or use `deploy.sh` from the repo (also download-only):

            ```bash
            sudo PICOGALLERY_VERSION=${{ steps.tag.outputs.name }} bash deploy.sh
            ```

            ### Supported Platforms
            | Archive | Architecture | Devices |
            |---------|-------------|---------|
            | `*-linux-aarch64.tar.gz` | 64-bit ARM | Pi Zero 2 W, Pi 3/4/5 (64-bit OS) |
            | `*-linux-armv7.tar.gz` | 32-bit ARM | Pi 2, Pi 3/4 (32-bit OS) |
